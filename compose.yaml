services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: meetpoint
      POSTGRES_PASSWORD: meetpoint
      POSTGRES_DB: meetpoint
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetpoint -d meetpoint"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql+psycopg://meetpoint:meetpoint@db:5432/meetpoint
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 3s
      timeout: 3s
      start_period: 10s
      retries: 10
    depends_on:
      db:
        condition: service_healthy

  tests:
    profiles: ["test"]
    build:
      context: .
      target: tests
    environment:
      DATABASE_URL: postgresql+psycopg://meetpoint:meetpoint@db:5432/meetpoint
      TEST_DATABASE_URL: postgresql+psycopg://meetpoint:meetpoint@db:5432/meetpoint_test
      PUBLIC_BASE_URL: http://localhost:8000
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
