name: MeetPoint CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meetpoint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, migrations and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: meetpoint
          POSTGRES_PASSWORD: meetpoint
          POSTGRES_DB: meetpoint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meetpoint -d meetpoint"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://meetpoint:meetpoint@localhost:5432/meetpoint
      TEST_DATABASE_URL: postgresql+psycopg://meetpoint:meetpoint@localhost:5432/meetpoint_test
      PUBLIC_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check code style
        run: |
          ruff check .
          ruff format --check .
      - name: Create test database
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect(
              "postgresql://meetpoint:meetpoint@localhost:5432/meetpoint", autocommit=True
          ) as connection:
              connection.execute("CREATE DATABASE meetpoint_test")
          PY
      - name: Check migrations
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: Run integration tests with coverage
        run: >-
          python -m pytest --cov=app
          --cov-report=term-missing --cov-report=xml --cov-report=html
          --junitxml=reports/junit.xml
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: reports/
          if-no-files-found: ignore
          retention-days: 7

  demo-deploy:
    name: Build and deploy demo
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PUBLIC_BASE_URL: http://localhost:8000
      COMPOSE_PROJECT_NAME: meetpoint-demo
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build application image
        run: docker compose build app
      - name: Start database and apply migrations
        run: |
          docker compose up -d --wait db
          docker compose run --rm app python -m alembic upgrade head
      - name: Deploy application and seed demo data
        run: |
          docker compose up -d --wait app
          docker compose exec -T app python -m scripts.seed
      - name: Check acquaintance scenario over HTTP
        run: >-
          python -m scripts.smoke --base-url http://localhost:8000
          --report reports/demo.json
      - name: Collect container logs
        if: always()
        run: |
          mkdir -p reports
          docker compose logs --no-color > reports/compose.log
      - name: Save demo report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo-deploy
          path: reports/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop temporary demo
        if: always()
        run: docker compose down --volumes
